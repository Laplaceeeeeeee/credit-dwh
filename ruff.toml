# ============================================================
# ruff 静态检查配置（阶段三 · 第 18 步工程化收口）
#
# 为什么**显式锁规则集**：ruff 的默认规则集会随版本演进，
# 不写 select 的话"某天 CI 突然变红"就是因为 ruff 升级引入了新规则。
# 这里锁死规则集 + 在 requirements-dev.txt 里锁死版本，两头都锁。
# ============================================================
target-version = "py311"
line-length = 100

exclude = [
    ".venv",
    "data",
    "docs/archive",
    "07_bigdata/exchange",
    "07_bigdata/jars",
    "07_bigdata/warehouse",
    "08_benchmark/_exp",
    "08_benchmark/_spark_events",
]

[lint]
# 只开"真错"这一类：
#   E4xx 导入位置 / 星号导入 ｜ E7xx 语句级问题 ｜ E9xx 语法错
#   Fxxx 未定义名、未使用导入、重复定义 —— 这些是会真出 bug 的
# 刻意**不**开 E501(行太长) / W(空白) / I(isort) / UP / B 等风格与重构类规则：
# 一次性重排整个阶段二的代码库，会让本步 diff 从"工程化收口"变成"全仓重排"，
# 把真正的改动淹没在格式化噪音里。风格统一应该作为**单独一步**做。
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# 实验/探针脚本里保留"只跑一次、留个变量看看"的写法，不值得为它改代码
"08_benchmark/_results/*" = ["F"]
