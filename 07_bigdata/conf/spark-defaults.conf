# ============================================================
# Spark 默认参数（挂在 /opt/spark/conf/spark-defaults.conf）
# ============================================================

# ---------- 1) 元数据：用外部 Hive Metastore，而不是内置 Derby ----------
# ⚠️ spark.sql.catalogImplementation 是静态配置；spark-sql CLI 已默认 enableHiveSupport()，
#    写在这里无害，但不能用 SET 在会话里改。
spark.sql.catalogImplementation   hive
spark.hadoop.hive.metastore.uris  thrift://metastore:9083
spark.sql.warehouse.dir           /opt/spark/warehouse

# ⭐⭐ 关于 Metastore client 版本（本机实测结论，与指导书默认写法不同）
#
#   指导书默认写法是「显式匹配 3.1.3 + jars=maven」。本机实测：
#     · jars=maven 会走 Ivy 首次解析，跑了 7 分钟仍未完成（随后被超时中断），
#       而且 Ivy 缓存落在容器的**可写层**（/root/.ivy2），
#       容器一旦重建缓存就没了 → 对反复重建的教学环境非常脆弱；
#     · 容器的出网本身是通的（curl repo1.maven.org 返回 200），所以不是网络问题，
#       是 Ivy 解析慢。
#
#   因此本机改用 **Spark 内置的 Hive 2.3.9 client 直连 HMS 3.1.3**（即下面两行保持注释）：
#     · 实测 SHOW DATABASES 4.4 秒返回，建库/建表/分区/插入/查询全部正常；
#     · 代价：client(2.3.9) 与 server(3.1.3) 版本不一致，属于"可用但不推荐在生产使用"的组合
#       —— 生产上应统一版本，或用 jars=path 预置匹配版本的 jar（见下）。
#
#   需要版本严格对齐时，选下面任一方式（都别走 maven + 容器可写层）：
#     ① jars=path + 宿主机预下载 jar 目录挂进容器（推荐，可复现、不依赖首次联网）
#     ② jars=maven，但必须给容器挂一个命名卷到 /root/.ivy2（否则缓存随容器丢失）
#
# spark.sql.hive.metastore.version  3.1.3
# spark.sql.hive.metastore.jars     maven
# spark.sql.hive.metastore.jars.path  file:///opt/hive-jars/3.1.3/*.jar

# ---------- 2) 存储格式与压缩 ----------
spark.sql.sources.default         parquet
# Spark 的 ORC 默认压缩就是 snappy；显式写出便于阅读。
# ⚠️ 原生 Apache Hive 的默认是 ZLIB —— E3 讲 ORC 体积差异时别说错。
spark.sql.orc.compression.codec   snappy

# ---------- 3) 执行与并行度（E1–E5 的实验基准）----------
spark.sql.adaptive.enabled            true
spark.sql.adaptive.skewJoin.enabled   true
spark.sql.shuffle.partitions      20

# ---------- 4) 时区（批流对账要靠它，见第 19 步）----------
spark.sql.session.timeZone        Asia/Shanghai

# ---------- 5) 本机资源适配（⭐ 与指导书默认值的差异，务必知情）----------
#   本机 Docker Desktop 虚拟机的内存上限只有约 7.6 GB（宿主机物理内存 15.8 GB，
#   当前空闲约 6 GB），不足以按指导书默认值给 worker 3g/5g。
#   因此：driver/executor 各压到 1.5G/2G，并把 driver 内存显式写死，
#   避免 Spark 默认 1g driver 在大 shuffle 时 OOM。
spark.driver.memory               1500m
spark.executor.memory             2g
# 本地模式（spark-sql / local[4]）下也遵守上面的 driver 设置
spark.driver.maxResultSize        512m
